name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: pip install -e ".[dev]"
      - name: Загрузка spaCy-модели
        run: python -m spacy download ru_core_news_md
      - name: Линтер
        run: ruff check .
      - name: Проверка типов
        run: mypy src/nlp_fin
      - name: Тесты
        run: pytest